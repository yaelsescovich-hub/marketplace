<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel de ventas</title>
<style>
  :root { --navy:#22255A; --mostaza:#D8A828; --verde:#6FA52C; --rojo:#c0392b; --gris:#f4f4f6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system, system-ui, sans-serif; margin:0; background:var(--gris); color:#222; }
  header { background:var(--navy); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:5; }
  header h1 { font-size:17px; margin:0; }
  main { max-width:680px; margin:0 auto; padding:12px; }
  .card { background:#fff; border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  input, button { font-size:16px; }
  input { width:100%; padding:11px; border:1px solid #ccc; border-radius:8px; }
  button { padding:11px 16px; border:0; border-radius:8px; cursor:pointer; font-weight:600; }
  .btn-navy { background:var(--navy); color:#fff; width:100%; }
  .prod { display:flex; gap:10px; align-items:center; }
  .prod img { width:56px; height:42px; object-fit:cover; border-radius:6px; background:#eee; flex:none; }
  .prod .info { flex:1; min-width:0; }
  .prod .nom { font-weight:600; font-size:14px; line-height:1.25; }
  .prod .meta { font-size:12px; color:#666; margin-top:2px; }
  .acciones { display:flex; gap:6px; margin-top:10px; }
  .acciones input { width:110px; padding:8px; flex:none; }
  .b-vender { background:var(--rojo); color:#fff; flex:1; }
  .b-reponer { background:var(--verde); color:#fff; flex:1; }
  .b-precio { background:var(--mostaza); color:#fff; flex:none; }
  .tag { font-size:11px; padding:2px 8px; border-radius:20px; color:#fff; }
  .t-disponible { background:var(--verde); } .t-vendido { background:var(--rojo); } .t-reservado { background:var(--mostaza); }
  #estado { text-align:center; font-size:13px; color:#555; padding:6px; min-height:24px; }
  .ok { color:var(--verde); font-weight:700; } .err { color:var(--rojo); font-weight:700; }
  .oculto { display:none; }
  label.chk { font-size:13px; display:inline-flex; gap:6px; align-items:center; margin-top:8px; }
  label.chk input { width:auto; }
</style>
</head>
<body>
<header><h1>Panel de ventas &middot; Vitrina Privada</h1></header>
<main>
  <div id="login" class="card">
    <p style="margin-top:0">Entra con tu cuenta de siempre (la misma del CRM).</p>
    <input type="email" id="email" placeholder="correo" autocomplete="username" value="yaelsescovich@fourtms.com">
    <div style="height:8px"></div>
    <input type="password" id="pass" placeholder="clave" autocomplete="current-password">
    <div style="height:10px"></div>
    <button class="btn-navy" id="btnEntrar">Entrar</button>
    <div id="loginmsg" style="color:var(--rojo);font-size:13px;margin-top:8px"></div>
  </div>

  <div id="panel" class="oculto">
    <div class="card">
      <input type="search" id="buscar" placeholder="Buscar por nombre o numero (ej: 241, lampara...)">
      <label class="chk"><input type="checkbox" id="soloDisp" checked> Solo disponibles</label>
    </div>
    <div id="estado"></div>
    <div id="lista"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="productos.js"></script>
<script>
var SUPA_URL = 'https://bgoetvepmyfpolowgwnr.supabase.co';
var SUPA_KEY = window.__SUPA_KEY_OVERRIDE || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJnb2V0dmVwbXlmcG9sb3dnd25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MzMxNTgsImV4cCI6MjA5ODQwOTE1OH0.9eE5iDiaMO9R3b_paSxMHnzLCrRA-ewreuFJhU-LnjU';
var db = window.supabase.createClient(SUPA_URL, SUPA_KEY);
var CAT = (window.PRODUCTOS || []).slice();
var OVR = {};

function $(id){ return document.getElementById(id); }
function msg(t, cls){ var e = $('estado'); e.textContent = t; e.className = cls || ''; }
function fmt(n){ return '$' + (n || 0).toLocaleString('es-CL'); }
function estadoDe(p){ var o = OVR[p.id]; return (o && o.estado_venta) || p.estadoVenta || 'disponible'; }
function precioDe(p){ var o = OVR[p.id]; return (o && o.precio > 0) ? o.precio : p.precio; }

async function entrar(){
  var r = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
  if (r.error){ $('loginmsg').textContent = 'No pude entrar: ' + r.error.message; return; }
  mostrarPanel();
}

function mostrarPanel(){
  $('login').classList.add('oculto');
  $('panel').classList.remove('oculto');
  cargar();
}

async function cargar(){
  msg('Cargando estado...');
  var r = await db.from('tienda_estado').select('id,estado_venta,precio');
  if (r.error){ msg('Error cargando: ' + r.error.message, 'err'); return; }
  OVR = {}; (r.data || []).forEach(function(x){ OVR[x.id] = x; });
  msg((r.data || []).length + ' cambios guardados en linea', 'ok');
  pintar();
}

function pintar(){
  var q = ($('buscar').value || '').toLowerCase().trim();
  var solo = $('soloDisp').checked;
  var out = CAT.filter(function(p){
    var est = estadoDe(p);
    if (solo && est !== 'disponible') return false;
    if (q && String(p.id) !== q && (p.nombre || '').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  var h = out.slice(0, 60).map(function(p){
    var est = estadoDe(p);
    var btn = est === 'disponible'
      ? '<button class="b-vender" data-accion="vendido" data-id="' + p.id + '">Marcar vendido</button>'
      : '<button class="b-reponer" data-accion="disponible" data-id="' + p.id + '">Volver a disponible</button>';
    return '<div class="card"><div class="prod">' +
      '<img src="' + (p.foto || '') + '" loading="lazy">' +
      '<div class="info"><div class="nom">#' + p.id + ' ' + (p.nombre || '') + '</div>' +
      '<div class="meta">' + fmt(precioDe(p)) + ' &middot; <span class="tag t-' + est + '">' + est + '</span></div></div></div>' +
      '<div class="acciones">' + btn +
      '<input type="number" id="pr' + p.id + '" placeholder="precio" value="' + precioDe(p) + '">' +
      '<button class="b-precio" data-accion="precio" data-id="' + p.id + '">$</button></div></div>';
  }).join('');
  $('lista').innerHTML = h || '<div class="card">Sin resultados</div>';
}

async function guardar(id, campos, exito){
  campos.id = id; campos.updated_at = new Date().toISOString();
  var r = await db.from('tienda_estado').upsert(campos);
  if (r.error){ msg('Error: ' + r.error.message, 'err'); return false; }
  OVR[id] = Object.assign(OVR[id] || { id: id }, campos);
  msg(exito, 'ok'); pintar(); return true;
}

document.addEventListener('click', function(ev){
  var b = ev.target.closest('button[data-accion]');
  if (!b) return;
  var id = parseInt(b.getAttribute('data-id'), 10);
  var acc = b.getAttribute('data-accion');
  if (acc === 'vendido' || acc === 'disponible'){
    msg('Guardando #' + id + '...');
    guardar(id, { estado_venta: acc }, '#' + id + ' \u2192 ' + acc + '. Visible en la tienda en segundos.');
  } else if (acc === 'precio'){
    var v = parseInt(($('pr' + id) || {}).value, 10);
    if (!v || v <= 0){ msg('Precio invalido', 'err'); return; }
    msg('Guardando precio #' + id + '...');
    guardar(id, { precio: v }, 'Precio de #' + id + ' \u2192 ' + fmt(v));
  }
});
$('btnEntrar').addEventListener('click', entrar);
$('pass').addEventListener('keydown', function(e){ if (e.key === 'Enter') entrar(); });
$('buscar').addEventListener('input', pintar);
$('soloDisp').addEventListener('change', pintar);

db.auth.getSession().then(function(s){
  if (s.data && s.data.session) mostrarPanel();
});
</script>
</body>
</html>
